<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. AKM Lokman | Homeopathic & Cytogenetics Specialist</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo" id="brandLogo"></a>
            <nav class="nav-menu" id="dynamicNavMenu"></nav>
            <div class="nav-actions">
                <select id="langSwitch" class="form-control" style="padding: 0.3rem;" onchange="changeLanguage(this.value)">
                    <option value="en">English</option>
                    <option value="bn">বাংলা</option>
                </select>
                <a href="admin.html" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Admin</a>
            </div>
        </div>
    </header>

    <section class="hero" id="hero">
        <div class="hero-container">
            <div class="hero-content">
                <div class="subtitle" id="heroSubtitle"></div>
                <h1 id="heroTitle"></h1>
                <p id="heroDescription" style="white-space: pre-line;"></p>
                <div class="hero-buttons">
                    <a href="#appointment" class="btn btn-primary" id="ctaMain">Book Appointment</a>
                    <a href="tel:01771770044" class="btn btn-outline" id="ctaSecondary">01771770044</a>
                </div>
            </div>
            <div class="hero-image">
                <img id="heroImg" src="" alt="Doctor">
            </div>
        </div>
    </section>

    <section id="about">
        <h2 class="section-title" id="aboutTitleText">About Me</h2>
        <div class="about-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: center;">
            <div><img id="aboutImg" src="" alt="About" style="width: 100%; border-radius: var(--border-radius); box-shadow: var(--shadow);"></div>
            <div>
                <p id="aboutBio" style="font-size: 1.05rem; color: var(--muted-color); margin-bottom: 1.5rem;"></p>
                <div style="background: var(--surface-color); padding: 1.25rem; border-radius: var(--border-radius); box-shadow: var(--shadow);">
                    <h4 style="color: var(--primary-color); margin-bottom: 0.5rem;" id="qualTitleText">Qualifications</h4>
                    <p id="aboutQual" style="color: var(--text-color); font-weight: 500;"></p>
                </div>
            </div>
        </div>
    </section>

    <section id="specializations">
        <h2 class="section-title" id="specTitleText">Specializations</h2>
        <div class="grid-4" id="specializationsContainer"></div>
    </section>

    <section id="services">
        <h2 class="section-title" id="srvTitleText">Services</h2>
        <div class="grid-3" id="servicesContainer"></div>
    </section>

    <div id="customSectionsContainer"></div>

    <section id="faq">
        <h2 class="section-title" id="faqTitleText">Frequently Asked Questions</h2>
        <div style="max-width: 800px; margin: 0 auto;" id="faqContainer"></div>
    </section>

    <section id="appointment">
        <div class="appointment-section" style="background: var(--surface-color); border-radius: calc(var(--border-radius) * 2); padding: 2.5rem; box-shadow: var(--shadow);">
            <h2 class="section-title" id="apptTitleText" style="margin-bottom: 0.5rem;">Book an Appointment</h2>
            <form class="appointment-form" id="publicAppointmentForm" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 2rem;">
                <div class="form-group"><label id="lblName">Full Name</label><input type="text" id="apptName" class="form-control" required></div>
                <div class="form-group"><label id="lblPhone">Phone Number</label><input type="tel" id="apptPhone" class="form-control" required></div>
                <div class="form-group"><label id="lblEmail">Email Address</label><input type="email" id="apptEmail" class="form-control" required></div>
                <div class="form-group"><label id="lblDate">Preferred Date</label><input type="date" id="apptDate" class="form-control" required></div>
                <div class="form-group"><label id="lblTime">Preferred Time</label><input type="text" id="apptTime" class="form-control" required placeholder="e.g. 10:00 AM"></div>
                <div class="form-group full-width" style="grid-column: span 2;"><label id="lblMsg">Symptoms / Message</label><textarea id="apptMessage" class="form-control" rows="3"></textarea></div>
                <div class="form-group full-width" style="grid-column: span 2; text-align: center;"><button type="submit" id="btnSubmitAppt" class="btn btn-primary" style="width: 100%;">Confirm Appointment</button></div>
            </form>
        </div>
    </section>

    <footer>
        <div class="footer-container" style="max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; padding: 2rem;">
            <div><h3>Dr. AKM Lokman</h3><p>Pubali Bank Ground Floor, Poduar Bazar, Cumilla. Mobile: 01771770044</p></div>
            <div><p>&copy; 2026 Dr. Lokman. All rights reserved.</p></div>
        </div>
        <div class="developer-credit-badge" id="developerCreditContainer" style="text-align:center; padding-bottom:1.5rem; font-size:0.9rem; color:#64748b;"></div>
    </footer>

    <script src="data/default-data.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
